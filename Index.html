<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<meta
name="apple-mobile-web-app-capable"
content="yes"
/>

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent"
/>

<meta
name="theme-color"
content="#050816"
/>

<title>CASH КАЛЬКУЛЯТОР</title>

<style>

@font-face{
font-family:'SF Pro Display';
src:local('SF Pro Display');
}

:root{

--glass:
rgba(255,255,255,.07);

--border:
rgba(255,255,255,.12);

--text:
rgba(255,255,255,.96);

--sub:
rgba(255,255,255,.52);

--shadow:
0 20px 70px rgba(0,0,0,.45);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
-webkit-tap-highlight-color:transparent;
}

body{

font-family:
'SF Pro Display',
-apple-system,
BlinkMacSystemFont,
sans-serif;

min-height:100vh;

padding:
max(18px, env(safe-area-inset-top))
18px
max(40px, env(safe-area-inset-bottom));

background:
linear-gradient(
180deg,
#020617,
#081120,
#0b1324
);

overflow-y:auto;

position:relative;

display:flex;
justify-content:center;

}

body::before{

content:'';

position:fixed;
inset:0;

background:
url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=1600&auto=format&fit=crop')
center/cover;

filter:
blur(24px)
brightness(.35)
saturate(130%);

transform:scale(1.08);

z-index:-3;

}

body::after{

content:'';

position:fixed;
inset:0;

background:

radial-gradient(
circle at top,
rgba(0,140,255,.14),
transparent 30%
),

radial-gradient(
circle at bottom,
rgba(255,0,180,.12),
transparent 35%
),

rgba(0,0,0,.28);

z-index:-2;

}

.page{

width:100%;
max-width:430px;

display:flex;
flex-direction:column;

gap:18px;

}

.panel{

padding:22px;

border-radius:42px;

background:
rgba(255,255,255,.06);

backdrop-filter:
blur(42px)
saturate(180%);

-webkit-backdrop-filter:
blur(42px)
saturate(180%);

border:
1px solid rgba(255,255,255,.10);

box-shadow:

var(--shadow),

inset 0 1px 1px
rgba(255,255,255,.12);

display:flex;
flex-direction:column;

gap:18px;

position:relative;

overflow:hidden;

}

.panel::before{

content:'';

position:absolute;
inset:0;

background:
linear-gradient(
135deg,
rgba(255,255,255,.10),
transparent,
rgba(255,255,255,.04)
);

pointer-events:none;

}

.title{

font-size:30px;

font-weight:700;

letter-spacing:-1px;

color:white;

margin-bottom:6px;

}

.beta{
opacity:.55;
}

.glass-block{

padding:18px;

border-radius:30px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

backdrop-filter:
blur(24px);

-webkit-backdrop-filter:
blur(24px);

position:relative;

overflow:hidden;

}

.glass-block::before{

content:'';

position:absolute;

width:180px;
height:180px;

background:
radial-gradient(
circle,
rgba(255,255,255,.08),
transparent 70%
);

top:-90px;
right:-90px;

}

.big,
.kpi-label,
.hours-col label{

display:block;

font-size:14px;

font-weight:600;

color:var(--sub);

margin-bottom:12px;

padding-left:2px;

}

select,
input{

width:100%;

height:68px;

border:none;

outline:none;

border-radius:24px;

padding:0 18px;

background:
rgba(255,255,255,.06);

border:
1px solid rgba(255,255,255,.08);

color:white;

font-size:24px;

font-weight:700;

font-family:inherit;

appearance:none;

-webkit-appearance:none;

backdrop-filter:
blur(20px);

-webkit-backdrop-filter:
blur(20px);

}

input[type=range]{

height:12px;

padding:0;

border-radius:999px;

background:
rgba(255,255,255,.12);

}

.hours-block{

display:flex;
flex-direction:column;
gap:18px;

}

.hours-title{

font-size:22px;
font-weight:700;
letter-spacing:-1px;
color:white;

}

.hours-grid{

display:grid;

grid-template-columns:
1fr 1fr 1fr;

gap:12px;

}

.hours-col{

display:flex;
flex-direction:column;
gap:8px;

}

.hours-hint{

font-size:12px;

line-height:1.5;

color:
rgba(255,255,255,.38);

}

.kpi-title{

font-size:24px;
font-weight:700;
letter-spacing:-1px;
color:white;

}

.hint{

font-size:13px;
line-height:1.5;

color:
rgba(255,255,255,.42);

margin-top:-10px;

}

.kpi-row{

display:grid;

grid-template-columns:
1fr 1fr;

gap:14px;

}

.kpi-block{

display:flex;
flex-direction:column;
gap:14px;

}

.kpi-inputs{

display:flex;
flex-direction:column;
gap:12px;

}

.result-block{

padding:24px;

border-radius:34px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

display:flex;
flex-direction:column;
gap:20px;

backdrop-filter:
blur(24px);

}

.result-row{

display:flex;
justify-content:space-between;
align-items:center;

}

.res-label{

font-size:16px;

font-weight:600;

color:
rgba(255,255,255,.58);

}

.res-val{

font-size:21px;

font-weight:700;

letter-spacing:-.5px;

color:white;

}

.total{

padding-top:20px;

border-top:
1px solid rgba(255,255,255,.08);

}

.total .res-label,
.total .res-val{

font-size:34px;

font-weight:800;

letter-spacing:-1px;

color:white;

}

.calc-btn{

width:100%;

height:82px;

border:none;

border-radius:999px;

cursor:pointer;

background:
linear-gradient(
135deg,
rgba(0,140,255,.30),
rgba(170,0,255,.22)
);

backdrop-filter:
blur(40px);

color:white;

font-size:28px;

font-weight:700;

letter-spacing:-1px;

border:
1px solid rgba(255,255,255,.16);

box-shadow:

0 0 30px rgba(0,140,255,.20),

inset 0 1px 1px rgba(255,255,255,.18);

}

.slider-value{

margin-top:10px;

font-size:28px;

font-weight:700;

color:white;

text-align:center;

}

#funBtn{

position:fixed;

right:22px;

bottom:34px;

width:68px;
height:68px;

border:none;

border-radius:50%;

background:
rgba(255,255,255,.10);

backdrop-filter:
blur(30px)
saturate(180%);

border:
1px solid rgba(255,255,255,.14);

box-shadow:

0 10px 40px rgba(0,0,0,.35),

inset 0 1px 1px rgba(255,255,255,.18);

color:white;

font-size:38px;

font-weight:300;

cursor:pointer;

z-index:999;

}

#funPopup{

position:fixed;

left:50%;
bottom:120px;

transform:
translateX(-50%)
translateY(20px);

padding:18px 26px;

border-radius:28px;

background:
rgba(255,255,255,.10);

backdrop-filter:
blur(40px);

border:
1px solid rgba(255,255,255,.14);

color:white;

font-size:16px;

font-weight:600;

opacity:0;

pointer-events:none;

transition:.35s;

z-index:998;

}

#funPopup.show{

opacity:1;

transform:
translateX(-50%)
translateY(0);

}

.footer-glass{

width:100%;

text-align:center;

margin-top:22px;

padding-bottom:
max(10px, env(safe-area-inset-bottom));

font-size:13px;

font-weight:600;

color:
rgba(255,255,255,.35);

}

@media(max-width:480px){

.kpi-row{
grid-template-columns:1fr;
}

.hours-grid{
grid-template-columns:1fr;
}

.title{
font-size:26px;
}

.total .res-label,
.total .res-val{
font-size:26px;
}

}


.auth-screen,.profile-screen,.history-screen{max-width:430px;width:100%}
.hidden{display:none!important}
.history-item{margin-top:10px;padding:12px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.small-btn{height:60px;font-size:20px}
</style>

</head>

<body>


<div id="authScreen" class="page auth-screen">
<div class="panel">
<h1 class="title">CASH КАЛЬКУЛЯТОР</h1>
<div class="glass-block">
<input id="regName" placeholder="Имя">
<input id="regLast" placeholder="Фамилия">
<button class="calc-btn small-btn" onclick="registerUser()">Регистрация</button>
</div>
<div class="glass-block">
<input id="loginCode" placeholder="Код входа (6 цифр)">
<button class="calc-btn small-btn" onclick="loginUser()">Войти</button>
</div>
</div>
</div>

<div id="profileScreen" class="page profile-screen hidden">
<div class="panel">
<h1 class="title">Профиль</h1>
<div class="glass-block">
<div id="profileName"></div>
<div id="profileCode"></div>
</div>
<button class="calc-btn small-btn" onclick="openCalculator()">Открыть калькулятор</button>
<button class="calc-btn small-btn" onclick="showHistory()">История расчётов</button>
<button class="calc-btn small-btn" onclick="logout()">Выйти</button>
</div>
</div>

<div id="historyScreen" class="page history-screen hidden">
<div class="panel">
<h1 class="title">История</h1>
<div id="historyList"></div>
<button class="calc-btn small-btn" onclick="backProfile()">Назад</button>
</div>
</div>

<div class="page hidden" id="calculatorPage">

<div class="panel">

<h1 class="title">
CASH КАЛЬКУЛЯТОР
<span class="beta">БЛ</span>
</h1>

<div class="glass-block">

<label class="big">
Ставка / час
</label>

<input
type="range"
id="rateSlider"
min="100"
max="500"
value="250"
/>

<div
class="slider-value"
id="rateValue"
>
250 ₽
</div>

</div>

<div class="glass-block">

<label class="big">
Премия
</label>

<input
type="range"
id="premiumSlider"
min="100"
max="500"
value="250"
/>

<div
class="slider-value"
id="premiumValue"
>
250 ₽
</div>

</div>

<div class="glass-block">

<label class="big">
Формат точки
</label>

<select id="format">

<option value="BR">
BR
</option>

<option value="MAU">
MAU
</option>

</select>

</div>

<div class="glass-block hours-block">

<h3 class="hours-title">
Часы
</h3>

<div class="hours-grid">

<div class="hours-col">

<label>
с обедом
</label>

<input
id="hoursWith"
type="number"
placeholder="0"
/>

</div>

<div class="hours-col">

<label>
без обеда
</label>

<input
id="hoursWithout"
type="number"
placeholder="0"
/>

</div>

<div class="hours-col">

<label>
дополнительные
</label>

<input
id="hoursBuffer"
type="number"
placeholder="0"
/>

</div>

</div>

<p class="hours-hint">
брифы, обучение, праздничные и т.д.
</p>

</div>

<h2 class="kpi-title">
KPI
</h2>

<p class="hint">
Сумма весов KPI должна быть 100%
</p>

<div class="kpi-row">

<div class="glass-block kpi-block">

<label class="kpi-label">
KPI 1
</label>

<div class="kpi-inputs">

<input id="w1" type="number" placeholder="Вес %"/>
<input id="v1" type="number" placeholder="% выполнения"/>

</div>

</div>

<div class="glass-block kpi-block">

<label class="kpi-label">
KPI 2
</label>

<div class="kpi-inputs">

<input id="w2" type="number" placeholder="Вес %"/>
<input id="v2" type="number" placeholder="% выполнения"/>

</div>

</div>

</div>

<div class="kpi-row">

<div class="glass-block kpi-block">

<label class="kpi-label">
KPI 3
</label>

<div class="kpi-inputs">

<input id="w3" type="number" placeholder="Вес %"/>
<input id="v3" type="number" placeholder="% выполнения"/>

</div>

</div>

<div class="glass-block kpi-block">

<label class="kpi-label">
KPI 4
</label>

<div class="kpi-inputs">

<input id="w4" type="number" placeholder="Вес %"/>
<input id="v4" type="number" placeholder="% выполнения"/>

</div>

</div>

</div>

<button
class="calc-btn"
onclick="calculate()"
>
✦ Рассчитать
</button>
<button class="calc-btn small-btn" onclick="saveCalculation()">💾 Сохранить расчёт</button>

<div class="result-block">

<div class="result-row">
<div class="res-label">Ставка/час</div>
<div id="rate" class="res-val">—</div>
</div>

<div class="result-row">
<div class="res-label">Оклад</div>
<div id="oklad" class="res-val">—</div>
</div>

<div class="result-row">
<div class="res-label">Бонус</div>
<div id="bonus" class="res-val">—</div>
</div>

<div class="result-row total">
<div class="res-label">Итого</div>
<div id="total" class="res-val">—</div>
</div>

</div>

</div>

<div class="footer-glass">
СПИЗДИЛ КОД У САРАТОВА EGORKIN
</div>

</div>

<button id="funBtn">
＋
</button>

<div id="funPopup">
Пошел нахуй один долбоеб клиент.
</div>

<script>

const rateSlider =
document.getElementById('rateSlider');

const premiumSlider =
document.getElementById('premiumSlider');

const rateValue =
document.getElementById('rateValue');

const premiumValue =
document.getElementById('premiumValue');

function fmtMoney(n){
return Number(n).toFixed(2)+' ₽';
}

function normalizeKPIraw(raw){

const v = parseFloat(raw);

if(isNaN(v)) return null;
if(v < 80) return 0;
if(v >= 80 && v < 90) return 60;
if(v >= 90 && v < 100) return 80;
if(v === 100) return 100;

if(v > 100){

const over = v - 100;

return Math.min(
100 + over * 2.5,
125
);

}

return null;

}

function calculate(){

const baseRate =
parseFloat(rateSlider.value);

const premiumRate =
parseFloat(premiumSlider.value);

const format =
document.getElementById('format').value;

const hw =
parseFloat(document.getElementById('hoursWith').value) || 0;

const hwo =
parseFloat(document.getElementById('hoursWithout').value) || 0;

const buffer =
parseFloat(document.getElementById('hoursBuffer').value) || 0;

const rate =
format === 'MAU'
? baseRate * 1.10
: baseRate;

const oklad =
rate * (hw + buffer);

const bonusHour =
premiumRate;

const baseBonus =
bonusHour * hwo;

let bonus =
baseBonus;

const used = [];

for(let i=1;i<=4;i++){

const w =
parseFloat(document.getElementById('w'+i).value);

const v =
parseFloat(document.getElementById('v'+i).value);

if(!isNaN(w)||!isNaN(v)){

used.push({

w:isNaN(w)?0:w,
v:isNaN(v)?0:v

});

}

}

if(used.length > 0){

const sumW =
used.reduce((s,it)=>s+it.w,0);

const normalized =
sumW === 0
? used.map(()=>100/used.length)
: used.map(it=>(it.w/sumW)*100);

bonus = 0;

for(let i=0;i<used.length;i++){

const nRaw =
normalizeKPIraw(used[i].v);

const coefficient =
nRaw === null
? 0
: nRaw / 100;

bonus +=
(baseBonus / 100)
*
normalized[i]
*
coefficient;

}

}

const total =
oklad + bonus;

document.getElementById('rate').textContent =
fmtMoney(rate);

document.getElementById('oklad').textContent =
fmtMoney(oklad);

document.getElementById('bonus').textContent =
fmtMoney(bonus);

document.getElementById('total').textContent =
fmtMoney(total);

rateValue.textContent =
baseRate + ' ₽';

premiumValue.textContent =
premiumRate + ' ₽';

lastCalculation={
date:new Date().toLocaleString(),
total:fmtMoney(total),
rate:rate,
oklad:oklad,
bonus:bonus
};

}

document.querySelectorAll(
'input,select'
).forEach(el=>{

el.addEventListener('input',calculate);
el.addEventListener('change',calculate);

});

calculate();

const funBtn =
document.getElementById('funBtn');

const funPopup =
document.getElementById('funPopup');

funBtn.addEventListener(
'click',
()=>{

funPopup.classList.add('show');

setTimeout(()=>{

funPopup.classList.remove('show');

},2000);

}
);


let currentUser=null;
let lastCalculation=null;

function generateCode(){
 return Math.floor(100000+Math.random()*900000).toString();
}

function registerUser(){
 const first=document.getElementById('regName').value.trim();
 const last=document.getElementById('regLast').value.trim();
 if(!first||!last){alert('Введите имя и фамилию');return;}
 let code=generateCode();
 while(localStorage.getItem('user_'+code)){code=generateCode();}
 const user={first,last,code,history:[]};
 localStorage.setItem('user_'+code,JSON.stringify(user));
 alert('Сохраните код входа: '+code);
 loginByCode(code);
}

function loginUser(){
 loginByCode(document.getElementById('loginCode').value.trim());
}

function loginByCode(code){
 const raw=localStorage.getItem('user_'+code);
 if(!raw){alert('Пользователь не найден');return;}
 currentUser=code;
 localStorage.setItem('activeUser',code);
 const user=JSON.parse(raw);

 document.getElementById('authScreen').classList.add('hidden');
 document.getElementById('profileScreen').classList.remove('hidden');
 document.getElementById('calculatorPage').classList.add('hidden');
 document.getElementById('profileName').textContent=user.first+' '+user.last;
 document.getElementById('profileCode').textContent='Код: '+user.code;
}

function openCalculator(){
 document.getElementById('profileScreen').classList.add('hidden');
 document.getElementById('calculatorPage').classList.remove('hidden');
}

function backProfile(){
 document.getElementById('historyScreen').classList.add('hidden');
 document.getElementById('profileScreen').classList.remove('hidden');
}

function showHistory(){
 const user=JSON.parse(localStorage.getItem('user_'+currentUser));
 document.getElementById('profileScreen').classList.add('hidden');
 document.getElementById('historyScreen').classList.remove('hidden');
 const box=document.getElementById('historyList');
 box.innerHTML='';
 if(user.history.length===0){box.innerHTML='<div class="glass-block">История пуста</div>';return;}
 [...user.history].reverse().forEach(h=>{
   box.innerHTML += `<div class="history-item"><b>${h.total}</b><br>${h.date}</div>`;
 });
}

function saveCalculation(){
 if(!currentUser){alert('Войдите в аккаунт');return;}
 if(!lastCalculation){alert('Сначала выполните расчёт');return;}
 const user=JSON.parse(localStorage.getItem('user_'+currentUser));
 user.history.push(lastCalculation);
 localStorage.setItem('user_'+currentUser,JSON.stringify(user));
 alert('Расчёт сохранён');
}

function logout(){
 localStorage.removeItem('activeUser');
 location.reload();
}

window.addEventListener('load',()=>{
 const active=localStorage.getItem('activeUser');
 if(active){loginByCode(active);}
});

</script>

</body>
</html>
