<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonic Liquid Glass</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:'Inter',sans-serif;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at top left,#2563eb 0%,transparent 30%),
        radial-gradient(circle at bottom right,#9333ea 0%,transparent 30%),
        linear-gradient(160deg,#040816,#07101f,#09172b);

    color:white;
}

/* BG */

.bg{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.55;
    animation:float 14s infinite ease-in-out;
}

.bg:nth-child(1){
    width:400px;
    height:400px;
    background:#2563eb;
    top:-120px;
    left:-120px;
}

.bg:nth-child(2){
    width:320px;
    height:320px;
    background:#7c3aed;
    right:-100px;
    bottom:-100px;
    animation-delay:4s;
}

.bg:nth-child(3){
    width:250px;
    height:250px;
    background:#06b6d4;
    left:50%;
    top:50%;
    animation-delay:7s;
}

@keyframes float{
    0%,100%{
        transform:translate(0,0) scale(1);
    }
    50%{
        transform:translate(30px,-40px) scale(1.08);
    }
}

/* APP */

.app{
    position:relative;
    z-index:10;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px;
}

/* GLASS */

.glass{
    position:relative;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.05)
        );

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);

    box-shadow:
        0 10px 40px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -1px 0 rgba(255,255,255,.04);

    overflow:hidden;
}

.glass::before{
    content:'';
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            130deg,
            rgba(255,255,255,.16),
            transparent 35%,
            transparent 60%,
            rgba(255,255,255,.03)
        );

    pointer-events:none;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo-icon{
    width:60px;
    height:60px;
    border-radius:24px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;

    background:
        linear-gradient(
            145deg,
            #3b82f6,
            #8b5cf6
        );

    box-shadow:
        0 10px 40px rgba(59,130,246,.5);

    animation:pulse 4s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
}

.logo h1{
    font-size:30px;
    letter-spacing:-1px;
}

.logo span{
    opacity:.6;
    font-size:13px;
}

.settings{
    width:56px;
    height:56px;
    border-radius:22px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;
}

/* HERO */

.hero{
    border-radius:42px;
    padding:30px;
}

/* CLEAN BUTTON */

.clean-wrap{
    display:flex;
    justify-content:center;
    margin:25px 0 35px;
}

.cleaner{
    position:relative;

    width:240px;
    height:240px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    background:
        radial-gradient(
            circle at 30% 30%,
            rgba(255,255,255,.3),
            rgba(255,255,255,.05)
        );

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(50px);

    box-shadow:
        0 0 100px rgba(59,130,246,.4),
        inset 0 0 40px rgba(255,255,255,.08);

    overflow:hidden;

    transition:.5s cubic-bezier(.2,.8,.2,1);

    animation:breath 5s infinite ease-in-out;
}

@keyframes breath{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.05);
    }
}

.cleaner.active{
    animation:activePulse 1s infinite;
}

@keyframes activePulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.1);
    }
}

.cleaner::before{
    content:'';

    position:absolute;

    width:420px;
    height:120px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transform:rotate(25deg);

    animation:shine 6s linear infinite;
}

@keyframes shine{
    from{
        transform:translateX(-300px) rotate(25deg);
    }
    to{
        transform:translateX(300px) rotate(25deg);
    }
}

.cleaner h2{
    position:relative;
    z-index:2;
    font-size:44px;
    letter-spacing:-2px;
}

/* RINGS */

.ring{
    position:absolute;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.12);

    animation:ring 4s infinite linear;
}

.ring:nth-child(1){
    width:100%;
    height:100%;
}

.ring:nth-child(2){
    width:130%;
    height:130%;
    animation-delay:1s;
}

.ring:nth-child(3){
    width:160%;
    height:160%;
    animation-delay:2s;
}

@keyframes ring{
    0%{
        transform:scale(.9);
        opacity:1;
    }
    100%{
        transform:scale(1.4);
        opacity:0;
    }
}

/* WAVEFORM */

.waveform{
    height:70px;

    display:flex;
    align-items:flex-end;
    justify-content:center;

    gap:5px;

    margin-bottom:25px;
}

.bar{
    width:7px;
    border-radius:20px;

    background:
        linear-gradient(
            to top,
            #60a5fa,
            #c084fc
        );

    animation:wave 1s infinite ease-in-out;
}

.bar:nth-child(2){animation-delay:.1s;}
.bar:nth-child(3){animation-delay:.2s;}
.bar:nth-child(4){animation-delay:.3s;}
.bar:nth-child(5){animation-delay:.4s;}
.bar:nth-child(6){animation-delay:.5s;}
.bar:nth-child(7){animation-delay:.6s;}
.bar:nth-child(8){animation-delay:.7s;}

@keyframes wave{
    0%,100%{
        height:10px;
    }
    50%{
        height:65px;
    }
}

/* SLIDER */

.control{
    margin-bottom:25px;
}

.control label{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    opacity:.8;
}

.slider{
    width:100%;
    appearance:none;

    height:12px;

    border-radius:30px;

    background:
        linear-gradient(
            90deg,
            #60a5fa 65%,
            rgba(255,255,255,.08) 65%
        );
}

.slider::-webkit-slider-thumb{
    appearance:none;

    width:30px;
    height:30px;

    border-radius:50%;

    background:white;

    border:5px solid rgba(255,255,255,.3);

    box-shadow:
        0 0 20px rgba(255,255,255,.7);

    cursor:pointer;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat{
    padding:18px;
    border-radius:24px;
    text-align:center;
}

.stat h3{
    margin-bottom:5px;
}

.stat p{
    opacity:.6;
    font-size:13px;
}

/* MODES */

.bottom{
    margin-top:auto;
}

.modes{
    display:flex;
    gap:12px;
    overflow:auto;
    padding:5px 0 10px;
}

.mode{
    min-width:130px;
    padding:18px;
    border-radius:24px;

    transition:.35s;
}

.mode:hover{
    transform:translateY(-5px);
}

.mode h4{
    margin-bottom:8px;
}

.mode p{
    font-size:12px;
    opacity:.65;
    line-height:1.5;
}

/* APPLE LIQUID DOCK */

.dock{
    position:relative;

    margin-top:18px;

    padding:14px;

    border-radius:38px;

    display:flex;
    justify-content:space-around;
    align-items:center;

    overflow:hidden;

    backdrop-filter:blur(50px) saturate(220%);
    -webkit-backdrop-filter:blur(50px) saturate(220%);
}

/* liquid moving glow */

.dock::before{
    content:'';

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.18),
            transparent 70%
        );

    filter:blur(25px);

    left:var(--x,50%);
    top:50%;

    transform:translate(-50%,-50%);

    transition:left .2s ease-out;

    pointer-events:none;
}

/* shine */

.dock::after{
    content:'';

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.12),
            transparent 30%,
            transparent 70%,
            rgba(255,255,255,.04)
        );

    pointer-events:none;
}

/* DOCK ICONS */

.dock-item{
    position:relative;

    width:62px;
    height:62px;

    border-radius:24px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;

    z-index:2;

    transition:
        transform .25s cubic-bezier(.2,.8,.2,1),
        background .25s ease,
        box-shadow .25s ease;
}

.dock-item:hover{

    transform:
        translateY(-12px)
        scale(1.12);

    background:
        rgba(255,255,255,.1);

    box-shadow:
        0 10px 30px rgba(255,255,255,.08),
        inset 0 1px 0 rgba(255,255,255,.1);
}

/* floating effect */

.dock:hover .dock-item:not(:hover){
    transform:scale(.94);
    opacity:.7;
}

/* MOBILE */

@media(max-width:700px){

    .cleaner{
        width:210px;
        height:210px;
    }

    .cleaner h2{
        font-size:38px;
    }

}

</style>
</head>
<body>

<div class="bg"></div>
<div class="bg"></div>
<div class="bg"></div>

<div class="app">

    <div class="header">

        <div class="logo">

            <div class="logo-icon">
                🔊
            </div>

            <div>
                <h1>Sonic</h1>
                <span>Liquid Speaker Cleaner</span>
            </div>

        </div>

        <div class="settings glass">
            ⚙️
        </div>

    </div>

    <div class="hero glass">

        <div class="clean-wrap">

            <div class="cleaner" id="cleaner">

                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>

                <h2 id="btnText">CLEAN</h2>

            </div>

        </div>

        <div class="waveform">

            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>

        </div>

        <div class="control">

            <label>
                <span>Frequency</span>
                <span id="freqText">165Hz</span>
            </label>

            <input
                type="range"
                min="0"
                max="250"
                value="165"
                class="slider"
                id="slider"
            >

        </div>

        <div class="stats">

            <div class="stat glass">
                <h3>98%</h3>
                <p>Power</p>
            </div>

            <div class="stat glass">
                <h3>250Hz</h3>
                <p>Boost</p>
            </div>

            <div class="stat glass">
                <h3>AI</h3>
                <p>Smart Clean</p>
            </div>

        </div>

    </div>

    <div class="bottom">

        <div class="modes">

            <div class="mode glass">
                <h4>Water Eject</h4>
                <p>Удаление воды мощными импульсами.</p>
            </div>

            <div class="mode glass">
                <h4>Deep Bass</h4>
                <p>Глубокие низкие частоты.</p>
            </div>

            <div class="mode glass">
                <h4>Ultra Sonic</h4>
                <p>Максимальная вибрация динамика.</p>
            </div>

        </div>

        <div class="dock glass" id="dock">

            <div class="dock-item">🏠</div>
            <div class="dock-item">🎵</div>
            <div class="dock-item">⚡</div>
            <div class="dock-item">💧</div>

        </div>

    </div>

</div>

<script>

/* AUDIO */

let audioContext;
let oscillator;
let gainNode;
let playing = false;

const cleaner = document.getElementById('cleaner');
const btnText = document.getElementById('btnText');

const slider = document.getElementById('slider');
const freqText = document.getElementById('freqText');

slider.addEventListener('input',()=>{

    freqText.innerText =
        slider.value + 'Hz';

    slider.style.background =
        `linear-gradient(
            90deg,
            #60a5fa ${slider.value / 2.5}%,
            rgba(255,255,255,.08) ${slider.value / 2.5}%
        )`;

    if(oscillator){
        oscillator.frequency.value =
            slider.value;
    }

});

function startSound(){

    audioContext =
        new(window.AudioContext || window.webkitAudioContext)();

    oscillator =
        audioContext.createOscillator();

    gainNode =
        audioContext.createGain();

    oscillator.type = 'sine';

    oscillator.frequency.value =
        slider.value;

    gainNode.gain.value = .2;

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start();

}

function stopSound(){

    oscillator.stop();

}

cleaner.addEventListener('click',()=>{

    if(!playing){

        startSound();

        cleaner.classList.add('active');

        btnText.innerText = 'STOP';

        navigator.vibrate?.([100,50,100]);

        playing = true;

    }else{

        stopSound();

        cleaner.classList.remove('active');

        btnText.innerText = 'CLEAN';

        playing = false;

    }

});

/* PARALLAX */

document.addEventListener('mousemove',(e)=>{

    const x =
        (window.innerWidth / 2 - e.pageX) / 35;

    const y =
        (window.innerHeight / 2 - e.pageY) / 35;

    cleaner.style.transform =
        `rotateY(${x}deg) rotateX(${-y}deg)`;

});

/* LIQUID DOCK */

const dock =
    document.getElementById('dock');

dock.addEventListener('mousemove',(e)=>{

    const rect =
        dock.getBoundingClientRect();

    const x =
        e.clientX - rect.left;

    dock.style.setProperty(
        '--x',
        `${x}px`
    );

});

/* hue animation */

let hue = 0;

setInterval(()=>{

    hue += .15;

    document.body.style.filter =
        `hue-rotate(${hue}deg)`;

},40);

</script>

</body>
</html>
