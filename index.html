<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hair AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
min-height:100vh;
padding:20px 20px 140px;
display:flex;
justify-content:center;
background:
radial-gradient(circle at 20% 20%,#2a73ff55,transparent 25%),
radial-gradient(circle at 80% 80%,#8c3fff55,transparent 30%),
#07101d;
color:white;
}

.card{
width:100%;
max-width:700px;
padding:28px;
border-radius:40px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(35px);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 12px 45px rgba(0,0,0,.35);
}

.logo{
font-size:48px;
font-weight:800;
text-align:center;
}

.sub{
text-align:center;
opacity:.8;
margin:8px 0 22px;
}

.upload{
display:flex;
justify-content:center;
align-items:center;
padding:22px;
border-radius:28px;
background:rgba(255,255,255,.08);
font-size:22px;
font-weight:700;
cursor:pointer;
margin-bottom:18px;
}

input{
display:none;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:28px;
background:rgba(255,255,255,.12);
color:white;
font-size:22px;
font-weight:800;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:22px;
}

.box{
padding:10px;
border-radius:22px;
background:rgba(255,255,255,.05);
}

.boxTitle{
text-align:center;
opacity:.7;
font-size:13px;
margin-bottom:8px;
}

img{
width:100%;
border-radius:18px;
display:none;
}

.loader{
display:none;
width:36px;
height:36px;
margin:18px auto;
border:3px solid rgba(255,255,255,.15);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.status{
text-align:center;
margin-top:18px;
min-height:24px;
}

.liquidBar{
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
width:min(94%,560px);
height:92px;
border-radius:44px;
background:rgba(20,20,30,.55);
backdrop-filter:blur(35px);
display:flex;
justify-content:space-around;
align-items:center;
overflow:hidden;
}

.pill{
position:absolute;
left:10px;
width:108px;
height:72px;
border-radius:34px;
background:rgba(255,255,255,.14);
transition:.35s;
}

.tab{
position:relative;
z-index:2;
width:25%;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
font-size:28px;
cursor:pointer;
}

.tab span{
font-size:13px;
}
</style>
</head>
<body>

<div class="card">

<div class="logo">✨ Hair AI</div>
<div class="sub">Liquid Hair Edit</div>

<label class="upload">
📷 Загрузить фото
<input id="file" type="file" accept="image/*">
</label>

<button id="btn">
Сменить причёску
</button>

<div class="loader" id="loader"></div>

<div class="grid">

<div class="box">
<div class="boxTitle">PHOTO</div>
<img id="preview">
</div>

<div class="box">
<div class="boxTitle">RESULT</div>
<img id="result">
</div>

</div>

<div class="status" id="status">
Готово
</div>

</div>

<div class="liquidBar">

<div class="pill" id="pill"></div>

<div class="tab" data-style="fade">✂️<span>Fade</span></div>
<div class="tab" data-style="quiff">🔥<span>Quiff</span></div>
<div class="tab" data-style="crop">⚡<span>Crop</span></div>
<div class="tab" data-style="side part">💎<span>Side</span></div>

</div>

<script>

const WORKER_URL =
"PASTE_WORKER_URL_HERE";

let imageFile=null;
let style="fade";

const preview=document.getElementById("preview");
const result=document.getElementById("result");
const loader=document.getElementById("loader");
const status=document.getElementById("status");
const btn=document.getElementById("btn");
const pill=document.getElementById("pill");

document.getElementById("file").onchange=e=>{

imageFile=e.target.files[0];

preview.src=
URL.createObjectURL(imageFile);

preview.style.display="block";

};

document.querySelectorAll(".tab")
.forEach((tab,i)=>{

tab.onclick=()=>{

pill.style.left=
(10+i*25)+"%";

style=
tab.dataset.style;

};

});

btn.onclick=async()=>{

if(!imageFile){
alert("Загрузи фото");
return;
}

loader.style.display="block";
status.innerText=
"AI меняет волосы...";

try{

const b64=
await toBase64(imageFile);

const res=
await fetch(WORKER_URL,{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
version:
"48f03523665cabe9a2e832ea9cc2d7c30ad5079cb5f1c1f07890d40596fe1f87",
input:{
input_image:b64,
haircut:style
}
})
});

const data=
await res.json();

console.log(data);

status.innerText=
"Запрос отправлен";

}catch(e){

status.innerText=
e.message;

}

loader.style.display="none";

};

function toBase64(file){
return new Promise(r=>{
const rd=
new FileReader();

rd.onload=
()=>r(rd.result);

rd.readAsDataURL(file);
});
}

</script>
</body>
</html>
