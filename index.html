<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hair AI v3</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
min-height:100vh;
padding:24px;
display:flex;
justify-content:center;
background:
radial-gradient(circle at 15% 20%,#1266ff60,transparent 25%),
radial-gradient(circle at 80% 85%,#8a2dff70,transparent 25%),
#050d1a;
color:white;
}

.card{
width:100%;
max-width:650px;
padding:28px;
border-radius:36px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.12);
backdrop-filter:blur(35px);
-webkit-backdrop-filter:blur(35px);
box-shadow:0 10px 45px rgba(0,0,0,.35);
}

.logo{
font-size:52px;
font-weight:800;
text-align:center;
margin-bottom:8px;
}

.sub{
text-align:center;
opacity:.8;
font-size:20px;
margin-bottom:28px;
}

.upload{
display:flex;
justify-content:center;
align-items:center;
padding:22px;
border-radius:28px;
background:rgba(255,255,255,.08);
font-size:24px;
font-weight:700;
cursor:pointer;
margin-bottom:18px;
}

input{
display:none;
}

.styles{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:20px;
}

.style{
padding:16px;
border-radius:20px;
background:rgba(255,255,255,.07);
border:1px solid transparent;
cursor:pointer;
text-align:center;
transition:.2s;
}

.style.active{
border:1px solid #7e9fff;
background:rgba(126,159,255,.18);
}

button{
width:100%;
padding:22px;
border:none;
border-radius:28px;
font-size:24px;
font-weight:800;
cursor:pointer;
background:rgba(255,255,255,.12);
color:white;
}

button:disabled{
opacity:.5;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-top:25px;
}

.box{
padding:12px;
border-radius:24px;
background:rgba(255,255,255,.05);
}

.title{
font-size:14px;
opacity:.7;
margin-bottom:8px;
text-align:center;
}

img{
width:100%;
border-radius:18px;
display:none;
}

.loader{
display:none;
width:38px;
height:38px;
margin:20px auto;
border:3px solid rgba(255,255,255,.2);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

.status{
margin-top:18px;
text-align:center;
font-size:18px;
min-height:26px;
}
</style>
</head>
<body>

<div class="card">

<div class="logo">✨ Hair AI</div>
<div class="sub">AI подбор причёски</div>

<label class="upload">
📷 Загрузить фото
<input id="file" type="file" accept="image/*">
</label>

<div class="styles">

<div class="style active" data-style="low fade textured haircut">
Low Fade
</div>

<div class="style" data-style="quiff hairstyle volume">
Quiff
</div>

<div class="style" data-style="french crop haircut">
French Crop
</div>

<div class="style" data-style="side part hairstyle">
Side Part
</div>

</div>

<button id="btn">Подобрать причёску</button>

<div class="loader" id="loader"></div>

<div class="grid">

<div class="box">
<div class="title">ТВОЁ ФОТО</div>
<img id="preview">
</div>

<div class="box">
<div class="title">AI РЕЗУЛЬТАТ</div>
<img id="result">
</div>

</div>

<div class="status" id="status">
Готов к работе
</div>

</div>

<script>

const HF_TOKEN="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";

const MODEL=
"https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2-1";

let file=null;
let style="low fade textured haircut";

const preview=document.getElementById("preview");
const result=document.getElementById("result");
const status=document.getElementById("status");
const loader=document.getElementById("loader");
const btn=document.getElementById("btn");

document.getElementById("file").onchange=e=>{
file=e.target.files[0];

preview.src=URL.createObjectURL(file);
preview.style.display="block";

status.innerText="Фото загружено";
};

document.querySelectorAll(".style").forEach(el=>{

el.onclick=()=>{

document.querySelectorAll(".style")
.forEach(x=>x.classList.remove("active"));

el.classList.add("active");

style=el.dataset.style;
};

});

btn.onclick=generate;

async function generate(){

if(!file){
alert("Загрузи фото");
return;
}

btn.disabled=true;
loader.style.display="block";
status.innerText="AI создаёт причёску...";

try{

const prompt=
`portrait man, realistic ${style},
barber hairstyle,
keep same face,
photorealistic,
high quality`;

const response=await fetch(
MODEL,
{
method:"POST",
headers:{
Authorization:"Bearer "+HF_TOKEN,
"Content-Type":"application/json"
},
body:JSON.stringify({
inputs:prompt,
options:{
wait_for_model:true
}
})
});

if(!response.ok){

const txt=await response.text();
throw new Error(txt);
}

const blob=await response.blob();

result.src=URL.createObjectURL(blob);
result.style.display="block";

status.innerText="Готово ✨";

}catch(e){

console.log(e);
status.innerText="Ошибка HF / лимит / токен";

}finally{

loader.style.display="none";
btn.disabled=false;

}

}

</script>
</body>
</html>
