<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WheelFit</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header class="header glass">
<h1>WheelFit</h1>
<p>Примерка дисков на авто</p>
</header>

<section class="upload-section glass">

<label class="upload-btn">
<input type="file" id="carUpload" accept="image/*">
📸 Загрузить автомобиль
</label>

</section>

<section class="workspace glass">

<canvas id="canvas"></canvas>

<div class="controls">

<button id="saveBtn">
💾 Сохранить
</button>

</div>

</section>

<section class="catalog glass">

<h2>Каталог дисков</h2>

<input
type="text"
id="search"
placeholder="Поиск дисков..."
>

<div id="wheelGrid">

<div class="wheel-card"
data-wheel="wheels/bbs-chr.png">

<img src="wheels/bbs-chr.png">

<h3>BBS CH-R</h3>

</div>

<div class="wheel-card"
data-wheel="wheels/vossen-hf5.png">

<img src="wheels/vossen-hf5.png">

<h3>Vossen HF-5</h3>

</div>

<div class="wheel-card"
data-wheel="wheels/oz-ultra.png">

<img src="wheels/oz-ultra.png">

<h3>OZ Ultraleggera</h3>

</div>

<div class="wheel-card"
data-wheel="wheels/rotiform-rse.png">

<img src="wheels/rotiform-rse.png">

<h3>Rotiform RSE</h3>

</div>

<div class="wheel-card"
data-wheel="wheels/rays-te37.png">

<img src="wheels/rays-te37.png">

<h3>Rays TE37</h3>

</div>

</div>

</section>

</div>

<script src="app.js"></script>

</body>
</html>
