<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hair AI FLUX</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
min-height:100vh;
padding:20px 20px 140px;
display:flex;
justify-content:center;
background:
radial-gradient(circle at 15% 20%,#2b6dff55,transparent 25%),
radial-gradient(circle at 85% 85%,#7c3fff70,transparent 30%),
#050c17;
color:white;
}

.card{
width:100%;
max-width:650px;
padding:30px;
border-radius:38px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(40px);
border:1px solid rgba(255,255,255,.1);
box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.logo{
font-size:52px;
font-weight:800;
text-align:center;
margin-bottom:8px;
}

.sub{
text-align:center;
opacity:.8;
font-size:20px;
margin-bottom:24px;
}

.upload{
display:flex;
justify-content:center;
align-items:center;
padding:22px;
font-size:23px;
font-weight:700;
border-radius:30px;
background:rgba(255,255,255,.08);
cursor:pointer;
margin-bottom:18px;
}

input{
display:none;
}

button{
width:100%;
padding:22px;
border:none;
border-radius:30px;
font-size:24px;
font-weight:800;
background:rgba(255,255,255,.12);
color:white;
cursor:pointer;
}

button:disabled{
opacity:.5;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:22px;
}

.box{
padding:12px;
border-radius:24px;
background:rgba(255,255,255,.05);
}

.title{
font-size:14px;
opacity:.7;
text-align:center;
margin-bottom:8px;
}

img{
width:100%;
border-radius:18px;
display:none;
}

.loader{
display:none;
width:38px;
height:38px;
margin:20px auto;
border:3px solid rgba(255,255,255,.2);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

.status{
margin-top:18px;
text-align:center;
font-size:17px;
min-height:24px;
}

/* LIQUID BAR */

.liquidBar{
position:fixed;
left:50%;
bottom:20px;
transform:translateX(-50%);
width:min(94%,560px);
height:92px;
border-radius:44px;
background:rgba(20,20,30,.55);
backdrop-filter:blur(35px);
border:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-around;
align-items:center;
overflow:hidden;
box-shadow:
0 12px 40px rgba(0,0,0,.45),
inset 0 1px 0 rgba(255,255,255,.08);
}

.pill{
position:absolute;
left:10px;
width:108px;
height:72px;
border-radius:34px;
background:
linear-gradient(145deg,
rgba(255,255,255,.16),
rgba(255,255,255,.04));
backdrop-filter:blur(30px);
transition:.35s cubic-bezier(.2,.9,.2,1);
box-shadow:
inset 0 1px 2px rgba(255,255,255,.3),
0 0 25px rgba(100,130,255,.35);
}

.tab{
position:relative;
z-index:2;
width:25%;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
cursor:pointer;
font-size:30px;
}

.tab span{
font-size:13px;
font-weight:700;
}
</style>
</head>
<body>

<div class="card">

<div class="logo">✨ Hair AI</div>
<div class="sub">FLUX Liquid Glass</div>

<label class="upload">
📷 Загрузить фото
<input id="file" type="file" accept="image/*">
</label>

<button id="btn">Создать</button>

<div class="loader" id="loader"></div>

<div class="grid">

<div class="box">
<div class="title">PHOTO</div>
<img id="preview">
</div>

<div class="box">
<div class="title">AI</div>
<img id="result">
</div>

</div>

<div class="status" id="status">
Готов к работе
</div>

</div>

<div class="liquidBar">

<div class="pill" id="pill"></div>

<div class="tab" data-style="low fade haircut">✂️<span>Fade</span></div>
<div class="tab" data-style="quiff hairstyle">🔥<span>Quiff</span></div>
<div class="tab" data-style="french crop haircut">⚡<span>Crop</span></div>
<div class="tab" data-style="side part hairstyle">💎<span>Side</span></div>

</div>

<script>

const HF_TOKEN="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";

const API=
"https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-dev";

let style="low fade haircut";
let file=null;

const preview=document.getElementById("preview");
const result=document.getElementById("result");
const loader=document.getElementById("loader");
const status=document.getElementById("status");
const btn=document.getElementById("btn");
const pill=document.getElementById("pill");

document.getElementById("file").onchange=e=>{
file=e.target.files[0];
preview.src=URL.createObjectURL(file);
preview.style.display="block";
status.innerText="Фото загружено";
};

document.querySelectorAll(".tab")
.forEach((tab,i)=>{

tab.onclick=()=>{

pill.style.left=(10+i*25)+"%";
style=tab.dataset.style;

status.innerText=
"Стиль: "+tab.innerText.trim();

};

});

btn.onclick=generate;

async function generate(){

loader.style.display="block";
btn.disabled=true;

status.innerText=
"FLUX генерирует...";

try{

const prompt=
`ultra realistic portrait,
${style},
modern hairstyle,
barber haircut,
photorealistic,
high quality`;

const response=
await fetch(API,{
method:"POST",
headers:{
Authorization:
"Bearer "+HF_TOKEN,
"Content-Type":
"application/json"
},
body:JSON.stringify({
inputs:prompt,
parameters:{
num_inference_steps:28
},
options:{
wait_for_model:true
}
})
});

if(!response.ok){

const txt=
await response.text();

throw new Error(txt);
}

const blob=
await response.blob();

result.src=
URL.createObjectURL(blob);

result.style.display=
"block";

status.innerText=
"Готово ✨";

}catch(e){

console.log(e);

status.innerText=
"FLUX недоступен / лимит / токен";

}

loader.style.display="none";
btn.disabled=false;

}

</script>

</body>
</html>
