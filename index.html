<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hair AI Liquid</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
min-height:100vh;
padding:20px 20px 140px;
display:flex;
justify-content:center;
background:
radial-gradient(circle at 15% 20%,#1266ff55,transparent 25%),
radial-gradient(circle at 80% 85%,#8d32ff70,transparent 30%),
#040b17;
color:white;
}

.card{
width:100%;
max-width:650px;
padding:30px;
border-radius:38px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(38px);
-webkit-backdrop-filter:blur(38px);
border:1px solid rgba(255,255,255,.1);
box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.logo{
font-size:52px;
font-weight:800;
text-align:center;
margin-bottom:8px;
}

.sub{
text-align:center;
opacity:.85;
font-size:20px;
margin-bottom:25px;
}

.upload{
display:flex;
justify-content:center;
align-items:center;
padding:22px;
font-size:24px;
font-weight:700;
border-radius:30px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.08);
cursor:pointer;
margin-bottom:18px;
}

input{
display:none;
}

button{
width:100%;
padding:22px;
border:none;
border-radius:30px;
font-size:24px;
font-weight:800;
background:rgba(255,255,255,.12);
color:white;
cursor:pointer;
}

button:disabled{
opacity:.5;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:24px;
}

.box{
padding:12px;
border-radius:24px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.06);
}

.title{
font-size:14px;
opacity:.7;
text-align:center;
margin-bottom:8px;
}

img{
width:100%;
border-radius:18px;
display:none;
}

.loader{
display:none;
width:38px;
height:38px;
margin:20px auto;
border:3px solid rgba(255,255,255,.2);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

.status{
margin-top:18px;
text-align:center;
font-size:18px;
min-height:25px;
}

/* LIQUID BAR */

.liquidBar{
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
width:min(94%,560px);
height:92px;
border-radius:44px;
background:rgba(20,20,30,.55);
backdrop-filter:blur(35px);
-webkit-backdrop-filter:blur(35px);
border:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-around;
align-items:center;
overflow:hidden;
z-index:999;
box-shadow:
0 12px 40px rgba(0,0,0,.45),
inset 0 1px 0 rgba(255,255,255,.08);
}

.pill{
position:absolute;
width:108px;
height:72px;
border-radius:34px;
background:
linear-gradient(145deg,
rgba(255,255,255,.16),
rgba(255,255,255,.03));
backdrop-filter:blur(28px);
box-shadow:
inset 0 1px 2px rgba(255,255,255,.3),
0 0 25px rgba(70,130,255,.35);
left:10px;
transition:.35s cubic-bezier(.2,.9,.2,1);
}

.tab{
position:relative;
z-index:2;
width:25%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:30px;
cursor:pointer;
gap:4px;
}

.tab span{
font-size:13px;
font-weight:700;
opacity:.9;
}
</style>
</head>
<body>

<div class="card">

<div class="logo">✨ Hair AI</div>
<div class="sub">Liquid Glass AI подбор причёски</div>

<label class="upload">
📷 Загрузить фото
<input id="file" type="file" accept="image/*">
</label>

<button id="btn">Подобрать</button>

<div class="loader" id="loader"></div>

<div class="grid">

<div class="box">
<div class="title">ТВОЁ ФОТО</div>
<img id="preview">
</div>

<div class="box">
<div class="title">AI РЕЗУЛЬТАТ</div>
<img id="result">
</div>

</div>

<div class="status" id="status">
Выбери стиль и загрузи фото
</div>

</div>

<div class="liquidBar">

<div class="pill" id="pill"></div>

<div class="tab active"
data-style="low fade haircut">
✂️
<span>Fade</span>
</div>

<div class="tab"
data-style="quiff hairstyle">
🔥
<span>Quiff</span>
</div>

<div class="tab"
data-style="french crop haircut">
⚡
<span>Crop</span>
</div>

<div class="tab"
data-style="side part hairstyle">
💎
<span>Side</span>
</div>

</div>

<script>

const HF_TOKEN="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";

const MODEL=
"https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2-1";

let file=null;
let style="low fade haircut";

const preview=document.getElementById("preview");
const result=document.getElementById("result");
const status=document.getElementById("status");
const loader=document.getElementById("loader");
const btn=document.getElementById("btn");
const pill=document.getElementById("pill");

document.getElementById("file").onchange=e=>{

file=e.target.files[0];

preview.src=URL.createObjectURL(file);
preview.style.display="block";

status.innerText="Фото загружено";

};

document.querySelectorAll(".tab")
.forEach((tab,index)=>{

tab.onclick=()=>{

pill.style.left=
(10+(index*25))+"%";

style=tab.dataset.style;

status.innerText=
"Выбран: "+tab.innerText.trim();

};

});

btn.onclick=generate;

async function generate(){

if(!file){
alert("Загрузи фото");
return;
}

loader.style.display="block";
btn.disabled=true;

status.innerText=
"AI создаёт причёску...";

try{

const prompt=
`realistic portrait male,
${style},
modern haircut,
photorealistic,
high detail`;

const response=
await fetch(MODEL,{
method:"POST",
headers:{
Authorization:
"Bearer "+HF_TOKEN,
"Content-Type":
"application/json"
},
body:JSON.stringify({
inputs:prompt,
options:{
wait_for_model:true
}
})
});

if(!response.ok){

const txt=
await response.text();

throw new Error(txt);
}

const blob=
await response.blob();

result.src=
URL.createObjectURL(blob);

result.style.display=
"block";

status.innerText=
"Готово ✨";

}catch(e){

console.log(e);

status.innerText=
"HF: модель недоступна или лимит";

}

loader.style.display="none";
btn.disabled=false;

}

</script>
</body>
</html>
