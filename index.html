<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WheelFit Pro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="glass">
<h1>WheelFit Pro</h1>
<p>Каталог дисков и примерка</p>
</header>

<main>
<section class="glass">
<input type="file" id="carUpload" accept="image/*">
<canvas id="canvas"></canvas>
<div class="toolbar">
<button id="saveBtn">Сохранить</button>
<input id="search" placeholder="Поиск дисков">
</div>
</section>

<section class="glass">
<h2>Каталог дисков</h2>
<div id="catalog"></div>
</section>
</main>

<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
</body>
</html>
