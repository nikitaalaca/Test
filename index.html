<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair AI • Liquid</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
min-height:100vh;
padding:20px 20px 140px;
display:flex;
justify-content:center;
background:
radial-gradient(circle at 20% 20%, #2575ff55, transparent 25%),
radial-gradient(circle at 80% 80%, #8c38ff55, transparent 30%),
#07101d;
color:white;
}

.card{
width:100%;
max-width:680px;
padding:28px;
border-radius:38px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(35px);
-webkit-backdrop-filter:blur(35px);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 12px 45px rgba(0,0,0,.35);
}

.logo{
font-size:48px;
font-weight:800;
text-align:center;
margin-bottom:6px;
}

.sub{
text-align:center;
opacity:.8;
margin-bottom:22px;
font-size:18px;
}

.upload{
display:flex;
justify-content:center;
align-items:center;
padding:22px;
border-radius:28px;
background:rgba(255,255,255,.08);
cursor:pointer;
font-size:22px;
font-weight:700;
margin-bottom:16px;
}

input{display:none;}

button{
width:100%;
padding:20px;
border:none;
border-radius:28px;
background:rgba(255,255,255,.12);
color:white;
font-size:22px;
font-weight:800;
cursor:pointer;
}

button:disabled{
opacity:.55;
cursor:not-allowed;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:20px;
}

.box{
padding:10px;
border-radius:22px;
background:rgba(255,255,255,.05);
}

.boxTitle{
font-size:13px;
opacity:.7;
text-align:center;
margin-bottom:8px;
}

img{
width:100%;
border-radius:18px;
display:none;
}

.loader{
display:none;
width:36px;
height:36px;
margin:18px auto;
border:3px solid rgba(255,255,255,.15);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

.status{
margin-top:16px;
text-align:center;
font-size:17px;
min-height:24px;
}

/* LIQUID BAR */

.liquidBar{
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
width:min(94%,560px);
height:92px;
border-radius:44px;
background:rgba(20,20,30,.55);
backdrop-filter:blur(36px);
border:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-around;
align-items:center;
overflow:hidden;
box-shadow:
0 12px 40px rgba(0,0,0,.45),
inset 0 1px 0 rgba(255,255,255,.08);
}

.pill{
position:absolute;
left:10px;
width:108px;
height:72px;
border-radius:34px;
background:linear-gradient(
145deg,
rgba(255,255,255,.18),
rgba(255,255,255,.04)
);
backdrop-filter:blur(28px);
transition:.35s cubic-bezier(.2,.9,.2,1);
box-shadow:
inset 0 1px 2px rgba(255,255,255,.3),
0 0 25px rgba(80,130,255,.3);
}

.tab{
position:relative;
z-index:2;
width:25%;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
font-size:28px;
cursor:pointer;
}

.tab span{
font-size:13px;
font-weight:700;
}
</style>
</head>
<body>

<div class="card">

<div class="logo">✨ Hair AI</div>
<div class="sub">Liquid Glass Hair Edit</div>

<label class="upload">
📷 Загрузить фото
<input id="file" type="file" accept="image/*">
</label>

<button id="btn">Сменить причёску</button>

<div class="loader" id="loader"></div>

<div class="grid">

<div class="box">
<div class="boxTitle">ТВОЁ ФОТО</div>
<img id="preview">
</div>

<div class="box">
<div class="boxTitle">AI RESULT</div>
<img id="result">
</div>

</div>

<div class="status" id="status">
Выбери стиль и загрузи фото
</div>

</div>

<div class="liquidBar">

<div class="pill" id="pill"></div>

<div class="tab" data-style="fade">✂️<span>Fade</span></div>
<div class="tab" data-style="quiff">🔥<span>Quiff</span></div>
<div class="tab" data-style="crop">⚡<span>Crop</span></div>
<div class="tab" data-style="side part">💎<span>Side</span></div>

</div>

<script>

const TOKEN = "PASTE_REPLICATE_TOKEN_HERE";

let imageFile=null;
let style="fade";

const preview=document.getElementById("preview");
const result=document.getElementById("result");
const status=document.getElementById("status");
const loader=document.getElementById("loader");
const btn=document.getElementById("btn");
const pill=document.getElementById("pill");

document.getElementById("file").onchange=e=>{

imageFile=e.target.files[0];

preview.src=URL.createObjectURL(imageFile);
preview.style.display="block";

status.innerText="Фото загружено";

};

document.querySelectorAll(".tab")
.forEach((tab,i)=>{

tab.onclick=()=>{

pill.style.left=(10+i*25)+"%";
style=tab.dataset.style;

status.innerText="Стиль: "+style;

};

});

btn.onclick=generate;

async function fileToBase64(file){
return new Promise((resolve)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.readAsDataURL(file);
});
}

async function generate(){

if(!imageFile){
alert("Загрузи фото");
return;
}

loader.style.display="block";
btn.disabled=true;
status.innerText="AI меняет волосы...";

try{

const img64=await fileToBase64(imageFile);

const create=await fetch(
"https://api.replicate.com/v1/predictions",
{
method:"POST",
headers:{
"Authorization":"Token "+TOKEN,
"Content-Type":"application/json"
},
body:JSON.stringify({
version:"48f03523665cabe9a2e832ea9cc2d7c30ad5079cb5f1c1f07890d40596fe1f87",
input:{
input_image:img64,
haircut:style,
aspect_ratio:"match_input_image",
output_format:"png"
}
})
});

const pred=await create.json();

if(pred.error){
throw new Error(pred.error);
}

let output=null;
let id=pred.id;

while(!output){

await new Promise(r=>setTimeout(r,2500));

const poll=await fetch(
"https://api.replicate.com/v1/predictions/"+id,
{
headers:{
"Authorization":"Token "+TOKEN
}
});

const data=await poll.json();

if(data.status==="succeeded"){
output=data.output;
break;
}

if(data.status==="failed"){
throw new Error("Prediction failed");
}

status.innerText=
"Генерация... "+data.status;

}

result.src=output;
result.style.display="block";

status.innerText="Готово ✨";

}catch(err){

console.log(err);
status.innerText="Ошибка API";

}

loader.style.display="none";
btn.disabled=false;

}

</script>
</body>
</html>
