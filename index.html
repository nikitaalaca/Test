<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Liquid Glass Music</title>

<style>

:root{
--glass:rgba(255,255,255,.08);
--glass-border:rgba(255,255,255,.12);
--text:#ffffff;
--radius:32px;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#020817;
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* background */

.bg{
position:fixed;
inset:0;
z-index:-1;
overflow:hidden;
}

.orb{
position:absolute;
border-radius:50%;
filter:blur(100px);
opacity:.8;
}

.o1{
width:400px;
height:400px;
background:#3b82f6;
top:-120px;
left:-120px;
}

.o2{
width:350px;
height:350px;
background:#8b5cf6;
right:-100px;
top:150px;
}

.o3{
width:300px;
height:300px;
background:#06b6d4;
bottom:-80px;
left:30%;
}

.container{
padding:22px;
padding-bottom:130px;
}

/* title */

.logo{
font-size:42px;
font-weight:800;
margin-top:10px;
margin-bottom:20px;
}

/* glass */

.glass{
background:rgba(255,255,255,.06);
backdrop-filter:blur(35px);
-webkit-backdrop-filter:blur(35px);
border:1px solid rgba(255,255,255,.12);
box-shadow:
0 10px 40px rgba(0,0,0,.3),
inset 0 1px rgba(255,255,255,.15);
}

/* search */

.search-box{
padding:16px;
border-radius:32px;
}

.search{
width:100%;
padding:18px;
border:none;
outline:none;
border-radius:22px;
font-size:16px;
}

.section{
margin-top:30px;
}

.section-title{
font-size:24px;
font-weight:700;
margin-bottom:16px;
}

/* cards */

.row{
display:flex;
gap:14px;
overflow-x:auto;
padding-bottom:6px;
}

.row::-webkit-scrollbar{
display:none;
}

.card{
min-width:170px;
border-radius:28px;
overflow:hidden;
position:relative;
}

.card img{
width:100%;
height:170px;
object-fit:cover;
display:block;
}

.card-info{
padding:12px;
}

.track{
font-weight:600;
}

.artist{
opacity:.6;
font-size:14px;
margin-top:4px;
}

/* mini player */

.player{
position:fixed;
left:15px;
right:15px;
bottom:15px;

border-radius:34px;
padding:14px;

display:flex;
align-items:center;
gap:14px;

z-index:100;
}

.cover{
width:60px;
height:60px;
border-radius:18px;
object-fit:cover;
}

.meta{
flex:1;
}

.name{
font-weight:600;
}

.author{
font-size:13px;
opacity:.6;
}

.play{
width:48px;
height:48px;
border:none;
border-radius:50%;
font-size:18px;
cursor:pointer;
}

/* fullscreen */

.fullscreen{
position:fixed;
inset:0;
background:#020817;

transform:translateY(100%);
transition:.5s cubic-bezier(.2,.8,.2,1);

z-index:999;
padding:24px;
}

.fullscreen.active{
transform:translateY(0);
}

.big-cover{
width:100%;
border-radius:40px;
margin-top:60px;
}

.close{
position:absolute;
top:30px;
right:30px;
font-size:32px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="bg">
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
</div>

<div class="container">

<div class="logo">
✨ Liquid Glass Music
</div>

<div class="glass search-box">
<input
class="search"
placeholder="Поиск музыки..."
>
</div>

<div class="section">

<div class="section-title">
🔥 Top Charts
</div>

<div class="row">

<div class="card glass">
<img src="https://picsum.photos/300?1">
<div class="card-info">
<div class="track">Top Track</div>
<div class="artist">Artist</div>
</div>
</div>

<div class="card glass">
<img src="https://picsum.photos/300?2">
<div class="card-info">
<div class="track">Top Track</div>
<div class="artist">Artist</div>
</div>
</div>

<div class="card glass">
<img src="https://picsum.photos/300?3">
<div class="card-info">
<div class="track">Top Track</div>
<div class="artist">Artist</div>
</div>
</div>

</div>

</div>

<div class="section">

<div class="section-title">
🎧 Trending
</div>

<div class="row">

<div class="card glass">
<img src="https://picsum.photos/300?4">
<div class="card-info">
<div class="track">Trending</div>
<div class="artist">Artist</div>
</div>
</div>

<div class="card glass">
<img src="https://picsum.photos/300?5">
<div class="card-info">
<div class="track">Trending</div>
<div class="artist">Artist</div>
</div>
</div>

</div>

</div>

</div>

<div class="player glass" id="player">

<img
class="cover"
src="https://picsum.photos/200"
>

<div class="meta">
<div class="name">Nothing Playing</div>
<div class="author">Select Track</div>
</div>

<button class="play">
▶
</button>

</div>

<div class="fullscreen" id="fullscreen">

<div class="close">✕</div>

<img
class="big-cover"
src="https://picsum.photos/800"
>

</div>

<script>

const player =
document.getElementById("player")

const fullscreen =
document.getElementById("fullscreen")

player.onclick=()=>{
fullscreen.classList.add("active")
}

document
.querySelector(".close")
.onclick=()=>{
fullscreen.classList.remove("active")
}

</script>

</body>
</html>
