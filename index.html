<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ОЧИСТКА</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{

    --accent:#60a5fa;
    --accent2:#3b82f6;

    --bg1:#050816;
    --bg2:#09111f;

    --sub:rgba(255,255,255,.55);

}

body{

    height:100vh;
    overflow:hidden;

    font-family:'Inter',sans-serif;

    color:white;

    transition:
        background 1s ease,
        filter 1s ease;

    background:
        radial-gradient(circle at top,var(--accent2) 0%,transparent 35%),
        linear-gradient(180deg,var(--bg1),var(--bg2));

}

/* =========================
   MODES COLORS
========================= */

body.water{

    --accent:#60a5fa;
    --accent2:#2563eb;

    --bg1:#050816;
    --bg2:#09111f;

}

body.bass{

    --accent:#a855f7;
    --accent2:#7c3aed;

    --bg1:#12081c;
    --bg2:#170f2c;

}

body.smart{

    --accent:#22c55e;
    --accent2:#16a34a;

    --bg1:#07130d;
    --bg2:#0f1d14;

}

/* =========================
   AMBIENT
========================= */

.ambient{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.light{

    position:absolute;

    width:340px;
    height:340px;

    border-radius:50%;

    filter:blur(120px);

    opacity:.14;

    transition:background 1s ease;

    animation:float 18s infinite ease-in-out;

}

.light.one{
    background:var(--accent2);
    top:-120px;
    left:-120px;
}

.light.two{
    background:var(--accent);
    right:-100px;
    bottom:-100px;
    animation-delay:6s;
}

@keyframes float{

    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(30px,-40px);
    }

}

/* =========================
   APP
========================= */

.app{

    position:relative;
    z-index:2;

    height:100vh;

    display:flex;
    flex-direction:column;

    padding:18px;

}

/* =========================
   ISLAND
========================= */

.island{

    width:126px;
    height:36px;

    margin:4px auto 20px;

    border-radius:30px;

    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    transition:
        width .7s cubic-bezier(.2,.8,.2,1),
        height .7s cubic-bezier(.2,.8,.2,1);

}

.island.active{
    width:260px;
    height:84px;
}

.island-inner{

    opacity:0;
    transform:translateY(10px);

    transition:.45s;

}

.island.active .island-inner{

    opacity:1;
    transform:translateY(0);

}

.live{

    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--accent);

    animation:pulse 2s infinite;

}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.5);
        opacity:.5;
    }

}

/* =========================
   GLASS
========================= */

.glass{

    position:relative;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.03)
        );

    border:1px solid rgba(255,255,255,.06);

    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 10px 30px rgba(0,0,0,.25);

    overflow:hidden;

}

.glass::before{

    content:'';

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            transparent 40%
        );

}

/* =========================
   HEADER
========================= */

.header{

    margin-bottom:20px;

}

.logo h1{

    font-size:34px;
    letter-spacing:-2px;

}

.logo p{

    font-size:13px;
    color:var(--sub);

    margin-top:4px;

}

/* =========================
   HERO
========================= */

.hero{

    border-radius:38px;
    padding:26px;

}

/* =========================
   ORB
========================= */

.orb-wrap{

    display:flex;
    justify-content:center;

    margin:20px 0 28px;

}

.orb{

    position:relative;

    width:190px;
    height:190px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    background:
        radial-gradient(
            circle at 30% 30%,
            rgba(255,255,255,.18),
            rgba(255,255,255,.02)
        );

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        inset 0 0 30px rgba(255,255,255,.04),
        0 0 60px color-mix(in srgb, var(--accent) 30%, transparent);

    transition:
        transform .8s cubic-bezier(.2,.8,.2,1),
        box-shadow 1s ease;

}

.orb.active{

    animation:breathe 2s infinite ease-in-out;

}

@keyframes breathe{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.04);
    }

}

.orb::before{

    content:'';

    position:absolute;

    width:240px;
    height:240px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.04);

}

.orb::after{

    content:'';

    position:absolute;
    inset:0;

    border-radius:50%;

    background:
        linear-gradient(
            130deg,
            rgba(255,255,255,.1),
            transparent 45%
        );

}

.orb h2{

    position:relative;
    z-index:2;

    font-size:34px;
    letter-spacing:-2px;

}

/* =========================
   VISUALIZER
========================= */

.visualizer{

    width:100%;
    height:70px;

    margin-bottom:24px;

}

/* =========================
   SLIDER
========================= */

.control{

    margin-bottom:22px;

}

.control label{

    display:flex;
    justify-content:space-between;

    margin-bottom:12px;

    font-size:14px;

    color:var(--sub);

}

.slider{

    width:100%;
    appearance:none;

    height:8px;

    border-radius:30px;

    background:
        linear-gradient(
            90deg,
            var(--accent) 65%,
            rgba(255,255,255,.08) 65%
        );

}

.slider::-webkit-slider-thumb{

    appearance:none;

    width:24px;
    height:24px;

    border-radius:50%;

    background:white;

    border:4px solid rgba(255,255,255,.2);

    box-shadow:
        0 0 18px rgba(255,255,255,.25);

}

/* =========================
   MODES
========================= */

.modes{

    display:flex;
    gap:10px;

    margin-bottom:18px;

}

.mode{

    flex:1;

    padding:16px;

    border-radius:24px;

    transition:
        transform .4s cubic-bezier(.2,.8,.2,1),
        background .4s,
        border .4s;

    cursor:pointer;

    border:1px solid transparent;

}

.mode:hover{

    transform:translateY(-3px);

}

.mode.active{

    background:rgba(255,255,255,.08);

    border:
        1px solid color-mix(in srgb, var(--accent) 50%, transparent);

    box-shadow:
        0 0 25px color-mix(in srgb, var(--accent) 20%, transparent);

}

.mode h4{

    margin-bottom:6px;
    font-size:15px;

}

.mode p{

    font-size:12px;
    line-height:1.4;

    color:var(--sub);

}

/* =========================
   STATS
========================= */

.stats{

    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:12px;

}

.card{

    padding:16px;
    border-radius:22px;

    text-align:center;

}

.card h3{

    margin-bottom:4px;

}

.card p{

    font-size:12px;
    color:var(--sub);

}

/* =========================
   DOCK
========================= */

.bottom{

    margin-top:auto;

}

.dock{

    display:flex;
    gap:10px;

    padding:10px;

    border-radius:34px;

    margin-top:20px;

}

.dock-item{

    flex:1;

    height:52px;

    border-radius:22px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:15px;
    font-weight:600;

    color:rgba(255,255,255,.6);

    transition:
        all .45s cubic-bezier(.2,.8,.2,1);

    cursor:pointer;

}

.dock-item.active{

    color:white;

    background:rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 0 25px color-mix(in srgb, var(--accent) 18%, transparent);

}

.dock-item:hover{

    transform:translateY(-2px);

    color:white;

}

/* =========================
   HOMEBAR
========================= */

.homebar{

    width:120px;
    height:5px;

    border-radius:30px;

    background:rgba(255,255,255,.22);

    margin:14px auto 0;

}

/* =========================
   MODE FLASH
========================= */

.flash{

    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle,
            color-mix(in srgb, var(--accent) 30%, transparent),
            transparent 70%
        );

    pointer-events:none;

    opacity:0;

    z-index:20;

}

.flash.active{

    animation:flash .8s ease;

}

@keyframes flash{

    0%{
        opacity:0;
    }

    30%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}

</style>
</head>
<body class="water">

<div class="flash" id="flash"></div>

<div class="ambient">

    <div class="light one"></div>
    <div class="light two"></div>

</div>

<div class="app">

    <div class="island" id="island">

        <div class="island-inner">

            <div style="
                display:flex;
                align-items:center;
                gap:10px;
            ">

                <div class="live"></div>

                <div>

                    <div style="
                        font-size:14px;
                        font-weight:600;
                    ">
                        Очистка активна
                    </div>

                    <div style="
                        font-size:12px;
                        opacity:.6;
                    ">
                        Вибрация динамика
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="header">

        <div class="logo">

            <h1>ОЧИСТКА</h1>

            <p>
                Жидкая очистка динамика
            </p>

        </div>

    </div>

    <div class="hero glass">

        <div class="orb-wrap">

            <div class="orb" id="orb">

                <h2 id="buttonText">
                    СТАРТ
                </h2>

            </div>

        </div>

        <canvas
            class="visualizer"
            id="visualizer"
        ></canvas>

        <div class="control">

            <label>

                <span>Частота</span>

                <span id="freq">
                    165Гц
                </span>

            </label>

            <input
                type="range"
                class="slider"
                id="slider"
                min="0"
                max="250"
                value="165"
            >

        </div>

        <div class="modes">

            <div
                class="mode glass active"
                data-mode="water"
            >

                <h4>Вода</h4>

                <p>
                    Удаление влаги из динамика
                </p>

            </div>

            <div
                class="mode glass"
                data-mode="bass"
            >

                <h4>Бас</h4>

                <p>
                    Глубокие низкие частоты
                </p>

            </div>

            <div
                class="mode glass"
                data-mode="smart"
            >

                <h4>Умный</h4>

                <p>
                    Адаптивная AI очистка
                </p>

            </div>

        </div>

        <div class="stats">

            <div class="card glass">
                <h3>98%</h3>
                <p>Мощность</p>
            </div>

            <div class="card glass">
                <h3>250Гц</h3>
                <p>Усиление</p>
            </div>

            <div class="card glass">
                <h3>AI</h3>
                <p>Адаптация</p>
            </div>

        </div>

    </div>

    <div class="bottom">

        <div class="dock glass">

            <div class="dock-item active">
                Очистка
            </div>

            <div class="dock-item">
                Усиление
            </div>

            <div class="dock-item">
                Вода
            </div>

            <div class="dock-item">
                Умный
            </div>

        </div>

        <div class="homebar"></div>

    </div>

</div>

<script>

/* =========================
   AUDIO
========================= */

let audioContext;
let oscillator;
let gainNode;

let playing = false;

const orb =
    document.getElementById('orb');

const island =
    document.getElementById('island');

const buttonText =
    document.getElementById('buttonText');

const slider =
    document.getElementById('slider');

const freq =
    document.getElementById('freq');

slider.addEventListener('input',()=>{

    freq.innerText =
        Math.floor(slider.value) + 'Гц';

    slider.style.background =
        `linear-gradient(
            90deg,
            var(--accent)
            ${slider.value / 2.5}%,
            rgba(255,255,255,.08)
            ${slider.value / 2.5}%
        )`;

    if(oscillator){

        oscillator.frequency.value =
            slider.value;

    }

});

function start(){

    audioContext =
        new(window.AudioContext ||
        window.webkitAudioContext)();

    oscillator =
        audioContext.createOscillator();

    gainNode =
        audioContext.createGain();

    oscillator.type = 'sine';

    oscillator.frequency.value =
        slider.value;

    gainNode.gain.value = .18;

    oscillator.connect(gainNode);

    gainNode.connect(
        audioContext.destination
    );

    oscillator.start();

}

function stop(){

    oscillator.stop();

}

orb.addEventListener('click',()=>{

    if(!playing){

        start();

        orb.classList.add('active');

        island.classList.add('active');

        buttonText.innerText =
            'СТОП';

        navigator.vibrate?.([100]);

        playing = true;

    }else{

        stop();

        orb.classList.remove('active');

        island.classList.remove('active');

        buttonText.innerText =
            'СТАРТ';

        playing = false;

    }

});

/* =========================
   VISUALIZER
========================= */

const canvas =
    document.getElementById('visualizer');

const ctx =
    canvas.getContext('2d');

function resizeCanvas(){

    canvas.width =
        canvas.offsetWidth;

    canvas.height =
        canvas.offsetHeight;

}

resizeCanvas();

window.addEventListener(
    'resize',
    resizeCanvas
);

function drawVisualizer(){

    requestAnimationFrame(
        drawVisualizer
    );

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const bars = 36;
    const gap = 10;

    for(let i=0;i<bars;i++){

        let wave =
            playing
            ? Math.sin(
                Date.now()/180 +
                i*.45
              ) * 18 + 26
            : 8;

        let x =
            i * gap + 6;

        let y =
            canvas.height/2 - wave/2;

        let gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                canvas.height
            );

        gradient.addColorStop(
            0,
            'rgba(255,255,255,.9)'
        );

        gradient.addColorStop(
            1,
            getComputedStyle(document.body)
            .getPropertyValue('--accent')
        );

        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.roundRect(
            x,
            y,
            5,
            wave,
            20
        );

        ctx.fill();

    }

}

drawVisualizer();

/* =========================
   AUTO SWEEP
========================= */

setInterval(()=>{

    if(playing){

        let value =
            Number(slider.value);

        value += .4;

        if(value > 250){
            value = 0;
        }

        slider.value = value;

        freq.innerText =
            Math.floor(value) + 'Гц';

        slider.style.background =
            `linear-gradient(
                90deg,
                var(--accent)
                ${value / 2.5}%,
                rgba(255,255,255,.08)
                ${value / 2.5}%
            )`;

        oscillator.frequency.value =
            value;

    }

},35);

/* =========================
   PARALLAX
========================= */

document.addEventListener(
    'mousemove',
    (e)=>{

    const x =
        (window.innerWidth/2 - e.pageX)/90;

    const y =
        (window.innerHeight/2 - e.pageY)/90;

    orb.style.transform =
        `translate(${x}px,${y}px)`;

});

/* =========================
   MODES
========================= */

const modes =
    document.querySelectorAll('.mode');

const flash =
    document.getElementById('flash');

modes.forEach(mode=>{

    mode.addEventListener('click',()=>{

        modes.forEach(m=>
            m.classList.remove('active')
        );

        mode.classList.add('active');

        document.body.className =
            mode.dataset.mode;

        flash.classList.remove('active');

        void flash.offsetWidth;

        flash.classList.add('active');

    });

});

/* =========================
   DOCK
========================= */

const tabs =
    document.querySelectorAll('.dock-item');

tabs.forEach(tab=>{

    tab.addEventListener('click',()=>{

        tabs.forEach(t=>
            t.classList.remove('active')
        );

        tab.classList.add('active');

    });

});

</script>

</body>
</html>
