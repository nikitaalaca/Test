<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at 20% 20%, #0057ff55, transparent 35%),
radial-gradient(circle at 80% 80%, #8b00ff55, transparent 35%),
#0b1020;
padding:20px;
}

.card{
width:100%;
max-width:450px;
padding:30px;
border-radius:35px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 8px 40px rgba(0,0,0,.35);
text-align:center;
color:white;
}

h1{
font-size:48px;
margin-bottom:8px;
}

.sub{
font-size:20px;
opacity:.85;
margin-bottom:25px;
}

.upload{
display:block;
padding:18px;
border-radius:22px;
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.15);
cursor:pointer;
margin-bottom:15px;
font-size:20px;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:22px;
font-size:22px;
font-weight:600;
cursor:pointer;
background:rgba(255,255,255,.14);
color:white;
backdrop-filter:blur(10px);
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

input{
display:none;
}

img{
margin-top:20px;
max-width:100%;
border-radius:22px;
display:none;
}

.status{
margin-top:18px;
opacity:.85;
font-size:18px;
}
</style>
</head>
<body>

<div class="card">

<h1>✨ Hair AI</h1>
<div class="sub">Бесплатный AI подбор причёски</div>

<label class="upload">
📷 Загрузить фото
<input type="file" id="file" accept="image/*">
</label>

<button onclick="generateHair()">Подобрать причёску</button>

<img id="preview">
<img id="result">

<div class="status" id="status">
Загрузка AI модели...
</div>

</div>

<script>

const HF_TOKEN = "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";

let imageFile = null;

document.getElementById("file").addEventListener("change", e => {

imageFile = e.target.files[0];

const preview = document.getElementById("preview");
preview.src = URL.createObjectURL(imageFile);
preview.style.display = "block";

});

async function generateHair(){

if(!imageFile){
alert("Загрузи фото");
return;
}

const status = document.getElementById("status");
const result = document.getElementById("result");

status.innerText = "AI создаёт причёску...";

try{

const response = await fetch(
"https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0",
{
method:"POST",
headers:{
"Authorization":"Bearer " + HF_TOKEN,
},
body: await buildPrompt()
}
);

if(!response.ok){
throw new Error("Ошибка HF");
}

const blob = await response.blob();

result.src = URL.createObjectURL(blob);
result.style.display="block";

status.innerText = "Готово ✨";

}catch(err){
console.log(err);
status.innerText = "Ошибка AI";
}

}

async function buildPrompt(){

const form = new FormData();

form.append("inputs",
"modern male haircut, low fade, quiff hairstyle, realistic hair transformation, photorealistic");

form.append("file", imageFile);

return form;

}

</script>

</body>
</html>
