<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
overflow-x:hidden;
background:
radial-gradient(circle at 15% 20%, #0f6fff60, transparent 30%),
radial-gradient(circle at 85% 80%, #8c3fff70, transparent 30%),
#07101f;
}

.card{
width:100%;
max-width:520px;
padding:30px;
border-radius:36px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.12);
backdrop-filter:blur(35px);
-webkit-backdrop-filter:blur(35px);
box-shadow:
0 10px 50px rgba(0,0,0,.4),
inset 0 1px 0 rgba(255,255,255,.08);
color:white;
animation:fade .6s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:none;
}
}

.logo{
font-size:48px;
font-weight:800;
text-align:center;
margin-bottom:10px;
}

.sub{
text-align:center;
font-size:19px;
opacity:.85;
margin-bottom:28px;
}

.upload{
display:flex;
justify-content:center;
align-items:center;
padding:22px;
font-size:23px;
font-weight:600;
border-radius:28px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.14);
cursor:pointer;
transition:.25s;
margin-bottom:18px;
}

.upload:hover{
transform:translateY(-2px);
}

input{
display:none;
}

button{
width:100%;
padding:22px;
font-size:23px;
font-weight:700;
border:none;
border-radius:28px;
background:rgba(255,255,255,.13);
color:white;
cursor:pointer;
transition:.25s;
backdrop-filter:blur(20px);
}

button:hover{
transform:translateY(-2px);
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.previewWrap{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:24px;
}

.box{
background:rgba(255,255,255,.05);
padding:12px;
border-radius:24px;
border:1px solid rgba(255,255,255,.08);
}

.boxTitle{
font-size:15px;
opacity:.7;
margin-bottom:10px;
text-align:center;
}

img{
width:100%;
border-radius:18px;
display:none;
}

.status{
margin-top:20px;
font-size:18px;
text-align:center;
opacity:.9;
min-height:24px;
}

.loader{
width:32px;
height:32px;
border:3px solid rgba(255,255,255,.15);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
margin:18px auto;
display:none;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}
</style>
</head>
<body>

<div class="card">

<div class="logo">✨ Hair AI</div>
<div class="sub">AI подбор и смена причёски</div>

<label class="upload">
📷 Загрузить фото
<input id="file" type="file" accept="image/*">
</label>

<button id="btn" onclick="generateHair()">
Подобрать причёску
</button>

<div class="loader" id="loader"></div>

<div class="previewWrap">

<div class="box">
<div class="boxTitle">ТВОЁ ФОТО</div>
<img id="preview">
</div>

<div class="box">
<div class="boxTitle">AI РЕЗУЛЬТАТ</div>
<img id="result">
</div>

</div>

<div class="status" id="status">
Готов к работе ✨
</div>

</div>

<script>

const HF_TOKEN="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";

let imageFile=null;

const file=document.getElementById("file");
const preview=document.getElementById("preview");
const result=document.getElementById("result");
const status=document.getElementById("status");
const loader=document.getElementById("loader");
const btn=document.getElementById("btn");

file.addEventListener("change",e=>{

imageFile=e.target.files[0];

if(!imageFile)return;

preview.src=URL.createObjectURL(imageFile);
preview.style.display="block";

status.innerText="Фото загружено";

});

async function generateHair(){

if(!imageFile){
alert("Сначала загрузи фото");
return;
}

btn.disabled=true;
loader.style.display="block";
status.innerText="AI создаёт новую причёску...";
result.style.display="none";

try{

const bytes=await imageFile.arrayBuffer();

const response=await fetch(
"https://api-inference.huggingface.co/models/timbrooks/instruct-pix2pix",
{
method:"POST",
headers:{
Authorization:"Bearer "+HF_TOKEN,
"Content-Type":"application/octet-stream",
"x-use-cache":"false"
},
body:bytes
});

if(!response.ok){

const txt=await response.text();
console.log(txt);

if(txt.includes("loading")){
status.innerText="Модель запускается... попробуй через 20 сек";
}else{
status.innerText="Ошибка AI";
}

throw new Error(txt);
}

const blob=await response.blob();

result.src=URL.createObjectURL(blob);
result.style.display="block";

status.innerText="Готово ✨";

}catch(err){

console.log(err);
status.innerText="Ошибка AI / лимит или загрузка модели";

}finally{

loader.style.display="none";
btn.disabled=false;

}

}

</script>

</body>
</html>
